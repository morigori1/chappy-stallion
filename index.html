<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050403">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="チャッピー">
<title>チャッピースタリオン</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="neural-bg" aria-hidden="true"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gold-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c0"/><stop offset=".35" stop-color="#f2d26b"/><stop offset=".65" stop-color="#d4af37"/><stop offset="1" stop-color="#9c7a22"/></linearGradient>
  <radialGradient id="core-g"><stop offset="0" stop-color="#fff6d0"/><stop offset=".5" stop-color="#f2d26b"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></radialGradient>
</defs></svg>
<!-- タイトル画面 -->
<section id="title-screen" class="screen active">
  <div class="title-bg" aria-hidden="true"><div class="rays"></div><div class="scan"></div></div>
  <div class="title-wrap">
    <div class="emblem-ring"><div class="emblem core-emblem"></div></div>
    <p class="pre-title">AI LAB MANAGEMENT SIMULATION</p>
    <h1 class="game-title">チャッピースタリオン</h1>
    <div class="ornament"><span></span>◆<em>CHAPPY STALLION</em>◆<span></span></div>
    <p class="subtitle">計算資源を、知性に変えよ。</p>
    <div class="title-form">
      <label>社名 <input id="company-name" maxlength="16" value="チャッピーAI"></label>
      <label>難易度
        <select id="difficulty">
          <option value="easy">イージー（初期資金 10億円）</option>
          <option value="normal" selected>ノーマル（初期資金 7億円）</option>
          <option value="hard">ハード（初期資金 4.5億円・強いライバル）</option>
        </select>
      </label>
    </div>
    <button id="start-btn" class="btn gold big">はじめる</button>
    <button id="howto-btn" class="btn ghost">遊び方</button>
    <p id="best-score" class="best"></p>
  </div>
</section>

<!-- ゲーム画面 -->
<section id="game-screen" class="screen">
  <header class="topbar">
    <div class="brand"><span class="brand-mark core-emblem"></span><span class="brand-text"><small>CHAPPY STALLION</small><span id="hdr-company"></span></span></div>
    <div class="turn-info">
      <span id="hdr-date"></span>
      <span class="ap"><small>行動力</small><span id="hdr-ap" class="pips"></span></span>
    </div>
    <button id="end-turn-btn" class="btn gold">四半期を終える ▶</button>
  </header>

  <main class="layout">
    <div id="nemesis-bar" class="nemesis-bar"></div>
    <div class="col-left">
      <div class="panel">
        <h2><span>ラボ・ダッシュボード</span><em>LAB</em></h2>
        <div class="stats" id="stats"></div>
      </div>
      <div class="panel">
        <h2><span>ラボコマンド</span><em>COMMANDS</em></h2>
        <div class="actions" id="actions"></div>
      </div>
      <div class="panel">
        <h2><span>稼働中プロダクト</span><em>PRODUCTS</em></h2>
        <div id="products" class="list"></div>
      </div>
    </div>
    <div class="col-right">
      <div class="panel">
        <h2><span>モデル順位</span><em>LEADERBOARD</em></h2>
        <div id="leaderboard" class="list"></div>
      </div>
      <div class="panel">
        <h2><span>ライバル戦況</span><em>RIVALS</em></h2>
        <div id="rivals"></div>
      </div>
      <div class="panel">
        <h2><span>モデル系譜</span><em>LINEAGE</em></h2>
        <div id="lineage" class="lineage"></div>
      </div>
      <div class="panel">
        <h2><span>研究チーム</span><em>RESEARCHERS</em></h2>
        <div id="crew" class="crew"></div>
      </div>
      <div class="panel">
        <h2><span>学会カレンダー</span><em>CONFERENCES</em></h2>
        <div id="confcal" class="cf-cal"></div>
      </div>
      <div class="panel">
        <h2><span>市場</span><em>MARKET</em></h2>
        <div id="market"></div>
      </div>
      <div class="panel log-panel">
        <h2><span>ラボ日誌</span><em>LOG</em></h2>
        <div id="log" class="log"></div>
      </div>
    </div>
  </main>
  <div id="turn-dock" class="turn-dock" role="status"><span id="dock-msg"></span><button id="dock-end" class="btn gold">四半期を終える ▶</button></div>
</section>

<!-- 終了画面 -->
<section id="end-screen" class="screen">
  <div class="title-bg" aria-hidden="true"><div class="rays"></div><div class="scan"></div></div>
  <div class="title-wrap">
    <div class="emblem-ring"><div class="emblem core-emblem" id="end-emblem"></div></div>
    <h1 class="game-title" id="end-title"></h1>
    <div class="ornament"><span></span>◆<em>GAME RESULT</em>◆<span></span></div>
    <p class="subtitle" id="end-sub"></p>
    <div class="end-stats" id="end-stats"></div>
    <button id="restart-btn" class="btn gold big">タイトルへ</button>
  </div>
</section>

<!-- モーダル -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-foot"><button class="btn ghost" id="modal-close">閉じる</button></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
